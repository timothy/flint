# Local Flint stack: Ollama serves Recursive's Flint model, Pi drives it.
# `task` installs the tools, configures and starts Ollama, downloads the model
# weights and points Pi at them. The weights live in ~/.ollama/models, never in
# this repo.
version: '3'

vars:
  MODEL: flint:40b-a2b-qat-int4
  OLLAMA_URL: http://127.0.0.1:11434
  CONTEXT_LENGTH: '131072'
  MAX_TOKENS: '32768'
  NUM_PARALLEL: '1'
  KEEP_ALIVE: 30m

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Install tools, start Ollama, download Flint and configure Pi
    cmds:
      - task: deps
      - task: pi:config

  run:
    desc: Install anything missing, start Ollama with Flint's settings, then open Pi in the current folder
    # Pi is a full-screen terminal app, and it opens in the folder `task` was
    # run from, for example `task -d ~/apps/Flint run` from another repo.
    interactive: true
    dir: '{{.USER_WORKING_DIR}}'
    cmds:
      - task: build
      - pi {{.CLI_ARGS}}

  deps:
    desc: Download the large dependencies (Ollama app, Pi, ~22 GB of Flint weights)
    cmds:
      - task: tools
      - task: ollama:config
      - task: ollama:start
      - task: model

  tools:
    desc: Install the Ollama app, Node.js, jq and the Pi coding agent if they are missing
    preconditions:
      - sh: command -v brew
        msg: Homebrew is required (https://brew.sh)
    cmds:
      - task: tools:ollama
      - task: tools:node
      - task: tools:jq
      - task: tools:pi

  tools:ollama:
    internal: true
    status:
      - test -d /Applications/Ollama.app
      - command -v ollama
    cmds:
      - brew install --cask ollama-app

  tools:node:
    internal: true
    status:
      - command -v npm
    cmds:
      - brew install node

  tools:jq:
    internal: true
    status:
      - command -v jq
    cmds:
      - brew install jq

  tools:pi:
    internal: true
    preconditions:
      - sh: |
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit(major > 22 || (major === 22 && minor >= 19) ? 0 : 1)'
        msg: Pi needs Node.js 22.19 or later; `node --version` shows the one on your PATH
    status:
      - command -v pi
    cmds:
      - npm install -g --ignore-scripts @earendil-works/pi-coding-agent

  ollama:config:
    desc: Set Ollama's server options for this login session (cleared at reboot)
    status:
      - test "$(launchctl getenv OLLAMA_CONTEXT_LENGTH)" = "{{.CONTEXT_LENGTH}}"
      - test "$(launchctl getenv OLLAMA_NUM_PARALLEL)" = "{{.NUM_PARALLEL}}"
      - test "$(launchctl getenv OLLAMA_KEEP_ALIVE)" = "{{.KEEP_ALIVE}}"
    cmds:
      - launchctl setenv OLLAMA_CONTEXT_LENGTH {{.CONTEXT_LENGTH}}
      - launchctl setenv OLLAMA_NUM_PARALLEL {{.NUM_PARALLEL}}
      - launchctl setenv OLLAMA_KEEP_ALIVE {{.KEEP_ALIVE}}

  ollama:start:
    desc: Start Ollama with Flint's settings (restarting it if it runs with others) and wait for its API
    status:
      - curl -fsS --max-time 2 -o /dev/null {{.OLLAMA_URL}}/api/version
      # The server keeps the environment it started with, which `ps -E` shows.
      - |
        env=$(ps -E -ww -o command= -p "$(pgrep -f 'ollama serve' | head -n 1)" | tr ' ' '\n')
        for setting in OLLAMA_CONTEXT_LENGTH={{.CONTEXT_LENGTH}} OLLAMA_NUM_PARALLEL={{.NUM_PARALLEL}} OLLAMA_KEEP_ALIVE={{.KEEP_ALIVE}}; do
          printf '%s\n' "$env" | grep -qx "$setting" || exit 1
        done
    cmds:
      # Ollama cancels a `quit` Apple Event, so send its app SIGTERM instead.
      - cmd: |
          curl -fs --max-time 2 -o /dev/null {{.OLLAMA_URL}}/api/version || exit 0
          echo "Restarting Ollama to apply Flint's settings"
          pkill -x Ollama || true
          for i in $(seq 30); do
            sleep 1
            curl -fs --max-time 1 -o /dev/null {{.OLLAMA_URL}}/api/version || exit 0
          done
          echo "Ollama is still answering on {{.OLLAMA_URL}} after 30 seconds; quit it and run task again" >&2
          exit 1
        silent: true
      - open -a Ollama
      - curl -fsS --retry 60 --retry-delay 1 --retry-connrefused --retry-max-time 90 -o /dev/null {{.OLLAMA_URL}}/api/version

  model:
    desc: Download the Flint weights (~22 GB; resumes partial downloads and retries)
    status:
      - ollama show {{.MODEL}} >/dev/null 2>&1
    cmds:
      - ./scripts/pull-model.sh {{.MODEL}}

  pi:config:
    desc: Point Pi at Flint with the planned limits and no web-search extension
    preconditions:
      - sh: command -v jq
        msg: jq is required (macOS 15 and later include it)
    status:
      - jq -e '.providers.ollama.models[] | select(.id == "{{.MODEL}}" and .contextWindow == {{.CONTEXT_LENGTH}} and .maxTokens == {{.MAX_TOKENS}})' "$HOME/.pi/agent/models.json" >/dev/null
      - jq -e '.defaultProvider == "ollama" and .defaultModel == "{{.MODEL}}" and ((.packages // []) | index("npm:@ollama/pi-web-search") | not)' "$HOME/.pi/agent/settings.json" >/dev/null
    cmds:
      # `ollama launch pi --config` needs an interactive terminal, so let the
      # launcher write Pi's config while it runs a harmless Pi command instead.
      - ollama launch pi --model {{.MODEL}} --yes -- --list-models </dev/null
      # The launcher also adds a web-search extension that calls Ollama's cloud
      # service. Remove it so the agent's traffic stays on loopback.
      - |
        if jq -e '(.packages // []) | index("npm:@ollama/pi-web-search")' "$HOME/.pi/agent/settings.json" >/dev/null; then
          pi remove npm:@ollama/pi-web-search </dev/null
        fi
      - |
        f="$HOME/.pi/agent/models.json"
        jq '(.providers.ollama.models[] | select(.id == "{{.MODEL}}")) |= . + {contextWindow: {{.CONTEXT_LENGTH}}, maxTokens: {{.MAX_TOKENS}}, compat: {maxTokensField: "max_tokens"}}' "$f" > "$f.tmp"
        mv "$f.tmp" "$f"
        chmod 600 "$f"

  smoke:
    desc: Run Recursive's tool-cycle check with Pi in a throwaway folder
    cmds:
      - ./scripts/smoke-test.sh {{.CLI_ARGS}}

  bench:
    desc: Measure prompt and generation speed (sizes via `task bench -- --sizes 1000,32000`)
    cmds:
      - python3 scripts/bench.py --model {{.MODEL}} --url {{.OLLAMA_URL}} {{.CLI_ARGS}}
